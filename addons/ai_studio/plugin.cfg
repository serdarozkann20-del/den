[plugin]

name="AI Studio"
description="Use AI models (OpenAI, Anthropic, Google, Nous/Hermes, OpenRouter, Ollama, any OpenAI-compatible endpoint) inside the Godot editor. Built-in Godot tools cover scenes, scene files, resources, scripts, project settings, export/CI, rigs (bone maps, animation retargeting), materials, physics, lighting and import settings, a runtime game bridge (godot-mcp's game_* commands), plus MCP servers - including the Hermes Agent MCP server. Targets Godot 4.7+."
author="AI Studio contributors"
version="1.0.0"
script="ai_studio_plugin.gd"
